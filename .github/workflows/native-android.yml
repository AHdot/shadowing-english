name: Native Android build and subtitle tests
on:
  push:
    branches: [ "native-android-rebuild" ]
    paths: [ "native-android/**", ".github/workflows/native-android.yml" ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Run subtitle tests
        working-directory: native-android
        run: gradle --no-daemon testDebugUnitTest
      - name: Build debug APK
        working-directory: native-android
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: MovieShadow100-native-debug
          path: native-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
